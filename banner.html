<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="400"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Background gradient ──────────────────────────────────────────────────────
const bg = ctx.createLinearGradient(0, 0, W, H);
bg.addColorStop(0,   '#000408');
bg.addColorStop(0.4, '#020d1a');
bg.addColorStop(0.7, '#030810');
bg.addColorStop(1,   '#000408');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, W, H);

// ── Circuit board grid ────────────────────────────────────────────────────────
function drawCircuit() {
  ctx.strokeStyle = 'rgba(0, 200, 255, 0.07)';
  ctx.lineWidth = 1;
  const step = 40;
  for (let x = 0; x <= W; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Circuit traces
  ctx.strokeStyle = 'rgba(0, 220, 255, 0.18)';
  ctx.lineWidth = 1.5;
  const traces = [
    [[0,80],[200,80],[200,120],[400,120]],
    [[800,80],[1000,80],[1000,40],[1200,40]],
    [[0,320],[150,320],[150,280],[350,280]],
    [[850,300],[1050,300],[1050,340],[1200,340]],
    [[0,200],[80,200],[80,160],[180,160]],
    [[1020,200],[1100,200],[1100,240],[1200,240]],
    [[400,0],[400,60],[440,60]],
    [[760,60],[800,60],[800,0]],
    [[300,400],[300,350],[340,350]],
    [[860,350],[900,350],[900,400]],
  ];
  traces.forEach(pts => {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  });

  // Circuit nodes / dots
  ctx.fillStyle = 'rgba(0, 220, 255, 0.5)';
  const nodes = [
    [200,80],[200,120],[400,120],[1000,80],[1000,40],
    [150,320],[150,280],[350,280],[1050,300],[1050,340],
    [80,200],[80,160],[180,160],[1100,200],[1100,240],
    [400,60],[800,60],[300,350],[900,350]
  ];
  nodes.forEach(([x,y]) => {
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI*2);
    ctx.fill();
  });
}
drawCircuit();

// ── Hexagon pattern ───────────────────────────────────────────────────────────
function hexagon(cx, cy, r, color) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 3) * i - Math.PI / 6;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.stroke();
}
const hexPositions = [
  [60,60,25],[60,340,25],[1140,60,25],[1140,340,25],
  [160,40,15],[160,360,15],[1040,40,15],[1040,360,15],
  [30,200,18],[1170,200,18],
];
hexPositions.forEach(([x,y,r]) => hexagon(x, y, r, 'rgba(0,200,255,0.2)'));

// ── Glow orbs ─────────────────────────────────────────────────────────────────
function glowOrb(x, y, r, color1, color2) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color1);
  g.addColorStop(1, color2);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fill();
}
glowOrb(200, 200, 160, 'rgba(0,120,255,0.12)', 'transparent');
glowOrb(1000, 200, 160, 'rgba(0,200,255,0.10)', 'transparent');
glowOrb(600, 200, 220, 'rgba(0,60,120,0.15)', 'transparent');

// ── Scanlines ─────────────────────────────────────────────────────────────────
for (let y = 0; y < H; y += 4) {
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0, y, W, 2);
}

// ── Top divider line ──────────────────────────────────────────────────────────
const topLine = ctx.createLinearGradient(0, 0, W, 0);
topLine.addColorStop(0,   'transparent');
topLine.addColorStop(0.2, '#00d4ff');
topLine.addColorStop(0.5, '#ffffff');
topLine.addColorStop(0.8, '#00d4ff');
topLine.addColorStop(1,   'transparent');
ctx.strokeStyle = topLine;
ctx.lineWidth = 2;
ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(W, 2); ctx.stroke();

// ── Bottom divider line ───────────────────────────────────────────────────────
const botLine = ctx.createLinearGradient(0, 0, W, 0);
botLine.addColorStop(0,   'transparent');
botLine.addColorStop(0.2, '#ff6600');
botLine.addColorStop(0.5, '#ffaa00');
botLine.addColorStop(0.8, '#ff6600');
botLine.addColorStop(1,   'transparent');
ctx.strokeStyle = botLine;
ctx.lineWidth = 2;
ctx.beginPath(); ctx.moveTo(0, H-2); ctx.lineTo(W, H-2); ctx.stroke();

// ── Side accent bars ──────────────────────────────────────────────────────────
const leftBar = ctx.createLinearGradient(0, 0, 0, H);
leftBar.addColorStop(0, 'transparent');
leftBar.addColorStop(0.5, 'rgba(0,212,255,0.8)');
leftBar.addColorStop(1, 'transparent');
ctx.strokeStyle = leftBar;
ctx.lineWidth = 3;
ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(2, H); ctx.stroke();

const rightBar = ctx.createLinearGradient(0, 0, 0, H);
rightBar.addColorStop(0, 'transparent');
rightBar.addColorStop(0.5, 'rgba(255,102,0,0.8)');
rightBar.addColorStop(1, 'transparent');
ctx.strokeStyle = rightBar;
ctx.lineWidth = 3;
ctx.beginPath(); ctx.moveTo(W-2, 0); ctx.lineTo(W-2, H); ctx.stroke();

// ── Corner brackets ───────────────────────────────────────────────────────────
function corner(x, y, size, flipX, flipY, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineCap = 'square';
  const dx = flipX ? -size : size;
  const dy = flipY ? -size : size;
  ctx.beginPath();
  ctx.moveTo(x + dx, y);
  ctx.lineTo(x, y);
  ctx.lineTo(x, y + dy);
  ctx.stroke();
}
corner(20, 20, 40, false, false, '#00d4ff');
corner(W-20, 20, 40, true, false, '#00d4ff');
corner(20, H-20, 40, false, true, '#ff6600');
corner(W-20, H-20, 40, true, true, '#ff6600');

// ── Small tech corner detail ──────────────────────────────────────────────────
ctx.strokeStyle = 'rgba(0,212,255,0.4)';
ctx.lineWidth = 1;
corner(35, 35, 20, false, false, 'rgba(0,212,255,0.3)');
corner(W-35, 35, 20, true, false, 'rgba(0,212,255,0.3)');
corner(35, H-35, 20, false, true, 'rgba(255,102,0,0.3)');
corner(W-35, H-35, 20, true, true, 'rgba(255,102,0,0.3)');

// ── "SYSTEM ONLINE" label top-left ────────────────────────────────────────────
ctx.font = '11px monospace';
ctx.fillStyle = 'rgba(0,212,255,0.6)';
ctx.fillText('◆ SYSTEM ONLINE', 50, 42);

// ── Version label top-right ───────────────────────────────────────────────────
ctx.textAlign = 'right';
ctx.fillText('v3.0.0 ◆', W-50, 42);
ctx.textAlign = 'left';

// ── Main title: MAHNGUELOH ───────────────────────────────────────────────────
function drawGlowText(text, x, y, font, gColor, tColor, blur, align='center') {
  ctx.save();
  ctx.textAlign = align;
  ctx.font = font;
  // Outer glow
  ctx.shadowColor = gColor;
  ctx.shadowBlur = blur;
  ctx.fillStyle = gColor;
  for (let i = 0; i < 3; i++) ctx.fillText(text, x, y);
  // Core text
  ctx.shadowBlur = 0;
  ctx.fillStyle = tColor;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// Shadow/depth layer
ctx.save();
ctx.textAlign = 'center';
ctx.font = 'bold 88px "Courier New", monospace';
ctx.fillStyle = 'rgba(0,40,80,0.8)';
ctx.fillText('MAHNGUELOH', W/2 + 3, 193);
ctx.restore();

// Main title glow
drawGlowText(
  'MAHNGUELOH',
  W/2, 190,
  'bold 88px "Courier New", monospace',
  'rgba(0,180,255,0.6)',
  '#ffffff',
  30
);

// ── Subtitle: -MD ─────────────────────────────────────────────────────────────
drawGlowText(
  '── MD ──',
  W/2, 240,
  'bold 36px "Courier New", monospace',
  'rgba(255,120,0,0.8)',
  '#ffaa33',
  20
);

// ── Horizontal separator line ─────────────────────────────────────────────────
const sepLine = ctx.createLinearGradient(300, 0, W-300, 0);
sepLine.addColorStop(0, 'transparent');
sepLine.addColorStop(0.3, 'rgba(0,212,255,0.5)');
sepLine.addColorStop(0.5, 'rgba(255,150,0,0.7)');
sepLine.addColorStop(0.7, 'rgba(0,212,255,0.5)');
sepLine.addColorStop(1, 'transparent');
ctx.strokeStyle = sepLine;
ctx.lineWidth = 1.5;
ctx.beginPath(); ctx.moveTo(300, 258); ctx.lineTo(W-300, 258); ctx.stroke();

// ── Diamond center decoration ──────────────────────────────────────────────
ctx.save();
ctx.translate(W/2, 258);
ctx.rotate(Math.PI/4);
ctx.strokeStyle = 'rgba(255,180,0,0.8)';
ctx.lineWidth = 1.5;
ctx.strokeRect(-6, -6, 12, 12);
ctx.restore();

// ── "POWERED BY ZACHARIAH" ───────────────────────────────────────────────────
drawGlowText(
  '⚡  POWERED BY ZACHARIAH  ⚡',
  W/2, 308,
  '600 22px "Courier New", monospace',
  'rgba(255,140,0,0.7)',
  '#ffcc55',
  15
);

// ── Bottom status bar ─────────────────────────────────────────────────────────
ctx.font = '11px monospace';
ctx.fillStyle = 'rgba(0,212,255,0.5)';
ctx.fillText('[ WhatsApp Multi-Device Bot ]', 50, H-30);

ctx.textAlign = 'right';
ctx.fillStyle = 'rgba(255,120,0,0.5)';
ctx.fillText('[ Node.js + Baileys ]', W-50, H-30);
ctx.textAlign = 'left';

// ── Particle dots scattered ────────────────────────────────────────────────
const particles = [
  [100,150,2],[150,80,1.5],[250,320,2],[320,60,1],
  [480,350,1.5],[550,70,2],[680,380,1],[750,40,2],
  [820,330,1.5],[920,80,2],[1000,350,1],[1100,150,2],
  [1050,260,1.5],[930,180,1],[200,260,1.5],[380,200,1],
];
particles.forEach(([x, y, r]) => {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  const grad = ctx.createRadialGradient(x,y,0,x,y,r*3);
  grad.addColorStop(0, 'rgba(0,200,255,0.9)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.fillStyle = '#00d4ff';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fill();
});

// ── Data stream lines (left & right edges) ─────────────────────────────────
for (let i = 0; i < 8; i++) {
  const y = 60 + i * 40;
  const len = 20 + Math.random() * 40;
  ctx.fillStyle = `rgba(0,212,255,${0.1 + i*0.03})`;
  ctx.font = '10px monospace';
  ctx.fillText(Math.random().toString(16).slice(2,8).toUpperCase(), 50 + Math.random()*60, y);
  ctx.textAlign = 'right';
  ctx.fillText(Math.random().toString(16).slice(2,8).toUpperCase(), W-50-Math.random()*60, y);
  ctx.textAlign = 'left';
}

console.log('Banner rendered');
</script>
</body>
</html>
